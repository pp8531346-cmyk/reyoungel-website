<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Basketball</title>
<style>
  html,body{margin:0;height:100%;background:#1b2a3a;display:flex;align-items:center;justify-content:center;font-family:sans-serif;overflow:hidden}
  #score{position:fixed;top:10px;left:14px;color:#fff;font-size:22px}
  #hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#9fb3c8;font-size:14px}
  canvas{background:#3a6b8a;touch-action:none}
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="c" width="400" height="600"></canvas>
<div id="hint">Click / tap to shoot</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score');
let score = 0;

const hoop = { x: 150, w: 100, y: 90, dir: 1, speed: 2 };
const startX = cv.width/2, startY = 560;
let ball = { x: startX, y: startY, r: 14, vx: 0, vy: 0, flying: false };
const gravity = 0.35;

function resetBall(){ ball.x = startX; ball.y = startY; ball.vx = 0; ball.vy = 0; ball.flying = false; }

cv.addEventListener('click', e => {
  if (ball.flying) return;
  const rect = cv.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  ball.vx = (cx - ball.x) / 22;
  ball.vy = -Math.max(11, (startY - cy) / 22);
  ball.flying = true;
});

function update(){
  hoop.x += hoop.dir * hoop.speed;
  if (hoop.x <= 0 || hoop.x + hoop.w >= cv.width) hoop.dir *= -1;

  if (ball.flying){
    ball.vy += gravity;
    ball.x += ball.vx;
    ball.y += ball.vy;

    const rimY = hoop.y;
    if (ball.vy > 0 && ball.y >= rimY - 6 && ball.y <= rimY + 10 &&
        ball.x > hoop.x + 14 && ball.x < hoop.x + hoop.w - 14){
      score++;
      scoreEl.textContent = 'Score: ' + score;
      resetBall();
    } else if (ball.y - ball.r > cv.height || ball.x < -30 || ball.x > cv.width + 30){
      resetBall();
    }
  }
}

function drawHoop(){
  ctx.fillStyle = '#eee';
  ctx.fillRect(hoop.x, hoop.y - 40, hoop.w, 8);
  ctx.strokeStyle = '#ff6a3d';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(hoop.x, hoop.y);
  ctx.lineTo(hoop.x + hoop.w, hoop.y);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++){
    ctx.beginPath();
    ctx.moveTo(hoop.x + 10 + i*(hoop.w-20)/3, hoop.y);
    ctx.lineTo(hoop.x + 18 + i*(hoop.w-20)/3, hoop.y + 22);
    ctx.stroke();
  }
}

function drawBall(){
  ctx.fillStyle = '#e2711d';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#7a3b0e';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ball.x-ball.r, ball.y); ctx.lineTo(ball.x+ball.r, ball.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ball.x, ball.y-ball.r); ctx.lineTo(ball.x, ball.y+ball.r); ctx.stroke();
}

function loop(){
  update();
  ctx.clearRect(0,0,cv.width,cv.height);
  drawHoop();
  drawBall();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
